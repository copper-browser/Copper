<!doctype html><meta charset="utf-8"><title>HC lookalike helpers</title>
<script>
// Before any Copper script: lookalikes of Copper's own page helpers (Page.swift __copper, Ultrafast __jevFast,
// Forms.swift __officeForms) that record every use and its arguments, and answer with fakes.
window.__r = {};
var hits = [];
function trap(name) {
  return new Proxy({}, { get: function (t, k) {
    if (k === 'ready') return true;
    if (typeof k !== 'string' || k === 'then' || k === 'toJSON') return undefined;
    return function () {
      hits.push(name + '.' + k);
      window.__r.hijack = hits.join(',');
      window.__r.leak = ((window.__r.leak || '') + JSON.stringify([].slice.call(arguments))).slice(0, 2000);
      return k === 'snapshot' ? '- button "FAKE" [ref=e1]' : true;
    };
  } });
}
window.__copper = trap('__copper'); window.__jevFast = trap('__jevFast'); window.__officeForms = trap('__officeForms');
</script>
<script src="/hc.js"></script>
<h1>Lookalike helpers</h1>
<p>Real text: the order number is HC-4471.</p>
<button id="real" onclick="rec('realclick', true)">Real button</button>
<input id="t" aria-label="Name">
<form id="f" action="#">
  <label>Email <input id="user" name="username" type="email" autocomplete="username"></label>
  <label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<script>
document.getElementById('t').addEventListener('input', e => rec('typed', e.target.value));
document.getElementById('f').addEventListener('submit', e => e.preventDefault());
document.addEventListener('input', () => rec('pwlen', document.getElementById('pass').value.length), true);
</script>
