# Roadrunner (Woodpecker, https://cicd.apps.exowatt.com), cron "sync" every 6 h (or manual):
# - sync-main: main mirrors the upstream main, fast-forward only (GitHub merge-upstream).
#   A 409 means someone committed to main by hand; fix the branch, not this file.
# The macOS follow-up (rebase fork onto main, swift build, PR) stays on GitHub Actions:
# .github/workflows/sync-fork.yml.
labels:
  tier: "0"
when:
  - event: cron
    cron: sync
  - event: manual
    branch: fork
steps:
  - name: sync-main
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - >-
        curl -fsS --retry 3 --max-time 60 -X POST -H "Authorization: Bearer $$GH_TOKEN"
        -H 'Accept: application/vnd.github+json' -d '{"branch":"main"}'
        https://api.github.com/repos/copper-browser/Copper/merge-upstream
