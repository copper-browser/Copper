# Roadrunner Mac (Woodpecker, https://cicd.apps.exowatt.com): build, sign and publish Copper as a
# GitHub release (release/roadrunner.sh; docs/releasing.md). Run a manual pipeline on fork with the
# variable COPPER_RELEASE=publish (or dry-run: build, sign, check, publish nothing; any branch);
# COPPER_PRERELEASE=true marks it a pre-release. The tap bumps itself from copper-version.json.
labels:
  platform: darwin/arm64
  tier: macos
when:
  - event: manual
    evaluate: 'COPPER_RELEASE == "publish" || COPPER_RELEASE == "dry-run"'
steps:
  - name: release
    image: bash
    environment:
      COPPER_SIGNING_P12_BASE64:
        from_secret: copper_signing_p12_base64
      COPPER_SIGNING_P12_PASSWORD:
        from_secret: copper_signing_p12_password
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - bash release/roadrunner.sh
