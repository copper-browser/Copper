# Roadrunner Mac (see sync.yaml): after sync-main, rebase fork onto main when main moved,
# swift build, push sync/<date> and open a PR to fork. A conflict fails; resolve per PATCHES.md.
labels:
  platform: darwin/arm64
  tier: macos
when:
  - event: cron
    cron: sync
  - event: manual
    branch: fork
depends_on: [sync]
steps:
  - name: rebase
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - bash release/sync-fork.sh
