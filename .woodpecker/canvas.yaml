# Roadrunner (Woodpecker + Dagger, https://cicd.apps.exowatt.com). The canvas page lives in
# copper-browser/canvas-app; Copper vendors its build (Canvas/README.md).
# - pull requests touching Canvas/: the vendored canvas.html must be the pinned canvas-app build;
# - hourly cron "canvas" (or manual): when canvas-app main's page moved, Canvas/bump.sh pushes
#   canvas/take-canvas-app and opens or updates one issue; it closes the issue once the pin caught up.
labels:
  tier: "0"
when:
  - event: pull_request
    path:
      include: ["Canvas/**"]
  - event: cron
    cron: canvas
  - event: manual
    branch: fork
steps:
  - name: check
    image: bash
    when:
      - event: pull_request
    commands:
      - >-
        ci-dagger v0.10.1 container-run --src=. --repo=Copper --apt=curl,ca-certificates --shell=bash
        --image=public.ecr.aws/docker/library/node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
        --run='bash Canvas/sync.sh --check'
  - name: bump
    image: bash
    when:
      - event: [cron, manual]
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - bash Canvas/bump.sh
