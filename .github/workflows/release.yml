name: release

# Builds Copper on a GitHub-hosted Mac and publishes it as a public GitHub
# release of this repo — the one place every install path reads from:
#
#   brew install --cask copper-browser/copper/copper     (tap bumps itself from
#                                                         copper-version.json)
#   curl -fsSL https://github.com/copper-browser/Copper/releases/latest/download/copper-install.sh | sh
#   https://github.com/copper-browser/Copper/releases/latest/download/copper-macos-arm64.zip
#   Copper's own updater (Fork/Updates.swift → latest/download/copper-version.json)
#
# Version scheme: <VERSION file>.<YYYYMMDD>.<run_number>, e.g. 1.0.20261001.1 —
# monotonic for Homebrew and the updater even when `fork` is rebased; stamped
# into CFBundleShortVersionString so About / MCP serverInfo.version match.
#
# Assets per release (tag v<version>):
#   copper-<version>-macos-arm64.zip(.sha256)  immutable, what the cask pins
#   copper-macos-arm64.zip(.sha256)            stable name → releases/latest/download/…
#   copper-version.json                        manifest for the updater + the tap's bump job
#   copper-install.sh                          the curl installer
#   copper-<version>-macos-arm64.dSYM.zip      the symbols build.sh strips out of the app, for
#                                              `copper crashes show N --symbolicate` (atos);
#                                              nothing installs or downloads it on its own
#
# Signing (docs/releasing.md): every release is signed with Copper's own
# certificate (release/copper-release-signing.cer; the p12 is the
# COPPER_SIGNING_P12_BASE64 / COPPER_SIGNING_P12_PASSWORD secrets, imported into a
# throwaway keychain on this runner and deleted after) and the explicit
# designated requirement in release/designated-requirement.txt. The requirement
# is the same for every release, so macOS keeps a person's grants (Full Disk
# Access, Files & Folders, Automation) and keychain "Always Allow" across
# updates, and Copper's updater refuses anything that doesn't satisfy it. Not a
# Developer ID and not notarized: the cask and the installer still clear the
# quarantine flag.
#
# publish=false (a dry run) builds, signs, checks and launches the release
# exactly the same way and keeps the zip as this run's artifact. No tag, no
# GitHub release, no asset upload — so nothing the updater, the installer or the
# tap reads changes. Only "Create the GitHub release" is handed GH_TOKEN, and
# checkout keeps no credentials, so no step in that path can write to the repo:
#
#   gh workflow run release.yml -R copper-browser/Copper --ref <branch> -f publish=false

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA); empty builds the branch this run was started from"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as a pre-release (not 'latest': the updater, installer and tap ignore it)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish: tag + GitHub release + assets. Off = a dry run: build, sign, check, keep the zip as this run's artifact"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-copper
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign + publish (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Publish or dry run
        id: mode
        env:
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ inputs.ref || github.ref }}
        run: |
          # Only an explicit true publishes; anything else is a dry run.
          if [ "$PUBLISH" = "true" ]; then echo "publish=true"; else echo "publish=false"; fi >> "$GITHUB_OUTPUT"
          echo "publish input: '${PUBLISH}', ref: '${REF}'"
          # A real release is built from fork only; dry runs may build any ref.
          if [ "$PUBLISH" = "true" ] && [ "$REF" != "fork" ] && [ "$REF" != "refs/heads/fork" ]; then
            echo "::error::publish=true builds from fork only, not '${REF}'. Use publish=false for a dry run of another ref."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Derive version
        id: meta
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          base="$(tr -d '[:space:]' < VERSION)"
          version="${base}.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          {
            echo "commit=${commit}"
            echo "version=${version}"
            echo "tag=v${version}"
            echo "zip_name=copper-${version}-macos-arm64.zip"
            echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${GITHUB_REPOSITORY}@${commit} as Copper ${version}"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: ./build.sh release app
        env:
          # Copper's own bundle id; without it build.sh makes the development
          # app (com.collinrijock.copper.dev).
          COPPER_RELEASE: "1"
          # build.sh's own signature is ad hoc; package-app.sh signs the release.
          SEARCH_SIGN_IDENTITY: ""
        run: |
          set -euo pipefail
          ./build.sh release app
          test -d build/Copper.app/Contents/MacOS
          test "$(plutil -extract CFBundleIdentifier raw -o - build/Copper.app/Contents/Info.plist)" = com.collinrijock.copper

      - name: Xos handoff validation
        run: swift test --filter xosInsert

      - name: Signing keychain (this runner only)
        id: keychain
        env:
          P12_BASE64: ${{ secrets.COPPER_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.COPPER_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::COPPER_SIGNING_P12_BASE64 / COPPER_SIGNING_P12_PASSWORD are not set. A release is never ad-hoc signed (docs/releasing.md)."
            exit 1
          fi
          umask 077
          keychain="${RUNNER_TEMP}/copper-signing.keychain-db"
          p12="${RUNNER_TEMP}/copper-signing.p12"
          # Before anything can fail: the delete step needs the path, and the
          # decoded p12 never outlives this step.
          echo "keychain=${keychain}" >> "$GITHUB_OUTPUT"
          trap 'rm -f "$p12"' EXIT
          pass="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$p12"
          # codesign may use the key without a prompt nobody could answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          # On the search list too, so codesign can build the identity's chain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The secret's certificate is the one release/ pins (hashes are public).
          want="$(shasum -a 1 release/copper-release-signing.cer | cut -d' ' -f1)"
          grep -q "certificate leaf = H\"${want}\"" release/designated-requirement.txt \
            || { echo "::error::release/designated-requirement.txt does not name release/copper-release-signing.cer (${want})"; exit 1; }
          identities="$(security find-identity -p codesigning "$keychain")"
          case "$(printf '%s' "$identities" | tr 'A-F' 'a-f')" in
            *"$want"*) ;;
            *)
              echo "::error::the signing secret does not hold the certificate release/ pins (${want}). Rotating? See docs/releasing.md."
              printf '%s\n' "$identities" | sed 's/"[^"]*".*$//'
              exit 1
              ;;
          esac
          echo "identity=${want}" >> "$GITHUB_OUTPUT"
          echo "signing identity ${want} (Copper Release Signing) in a keychain of this run only"

      - name: Stamp version, sign, zip
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          COPPER_SIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
          COPPER_SIGN_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/upload"
          bash release/package-app.sh build/Copper.app "$VERSION" "$out" >> "$GITHUB_OUTPUT"
          sha="$(cut -d' ' -f1 < "$out/$ZIP_NAME.sha256")"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          # Stable-name copy for releases/latest/download/… (installer, site).
          cp "$out/$ZIP_NAME" "$out/copper-macos-arm64.zip"
          printf '%s  copper-macos-arm64.zip\n' "$sha" > "$out/copper-macos-arm64.zip.sha256"
          cp release/copper-install.sh "$out/copper-install.sh"
          echo "dir=${out}" >> "$GITHUB_OUTPUT"
          plutil -p build/Copper.app/Contents/Info.plist | grep -E 'CFBundle(ShortVersionString|Version|Identifier)'

      - name: Delete the signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$KEYCHAIN" "${RUNNER_TEMP}/copper-signing.p12"
          security list-keychains -d user

      - name: Check the signature (the shipped zip)
        env:
          OUT: ${{ steps.package.outputs.dir }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          set -euo pipefail
          req="$(tr -d '\n' < release/designated-requirement.txt)"
          check="${RUNNER_TEMP}/check"
          rm -rf "$check" && mkdir -p "$check"
          ditto -x -k "$OUT/$ZIP_NAME" "$check"
          app="$check/Copper.app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = com.collinrijock.copper
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          # The designated requirement macOS will file grants under: the same
          # text for every release.
          dr="$(codesign -d -r- "$app" 2>/dev/null | sed -n 's/^designated => //p')"
          echo "designated => ${dr}"
          [ "$dr" = "$req" ] || { echo "::error::designated requirement is '${dr}', expected '${req}'"; exit 1; }
          # What an installed Copper from before signing checks (Updates.swift
          # stage + reverify): integrity alone. The first signed update must pass it.
          codesign --verify --deep --strict "$app"
          # What every Copper from now on checks before it swaps.
          codesign --verify --deep --strict -R="$req" "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Authority|Signature|TeamIdentifier|Runtime)' || true
          entitlements="$(codesign -d --entitlements - "$app" 2>/dev/null || true)"
          [ -z "$entitlements" ] || { echo "::error::entitlements appeared; releases carry none"; echo "$entitlements"; exit 1; }
          echo "cdhash $(codesign -dvvv "$app" 2>&1 | sed -n 's/^CDHash=//p' | head -1)"

      - name: Launch the shipped app (headless, this runner)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # A self-signed release must start like an ad-hoc one did: open the
          # unzipped bundle headless in a test world and ask it its version.
          app="${RUNNER_TEMP}/check/Copper.app"
          world=release-check
          port=4199
          defaults write "com.officecommun.search.test.${world}" welcomed -bool true
          open -n -g --stderr "${RUNNER_TEMP}/launch.log" \
            --env SEARCH_PROBE="$world" --env SEARCH_HEADLESS=1 --env SEARCH_MCP_PORT="$port" "$app"
          health=""
          for _ in $(seq 1 90); do
            health="$(curl -fsS --max-time 2 "http://127.0.0.1:${port}/health" 2>/dev/null || true)"
            [ -n "$health" ] && break
            sleep 1
          done
          pid="$(lsof -tiTCP:"$port" -sTCP:LISTEN 2>/dev/null | head -1 || true)"
          [ -n "$pid" ] && kill "$pid" || true
          if [ -z "$health" ]; then
            echo "::error::the signed app did not answer /health on ${port} within 90 s"
            cat "${RUNNER_TEMP}/launch.log" || true
            exit 1
          fi
          echo "$health"
          case "$health" in
            *"$VERSION"*) ;;
            *) echo "::error::/health does not report ${VERSION}"; exit 1 ;;
          esac

      - name: Zip the dSYM
        env:
          OUT: ${{ steps.package.outputs.dir }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The release binary ships stripped, so its crash reports have bare
          # offsets; this is what names them. Only attached when its UUID is
          # the shipped binary's (strip and the ad-hoc re-sign keep LC_UUID) —
          # a dSYM that doesn't match would only mislead. Missing is a warning,
          # not a failed release: build.sh treats it the same way.
          dsym=build/Copper.app.dSYM
          if [ ! -d "$dsym" ]; then
            echo "::warning::no $dsym — this release's crash reports won't symbolicate"
            exit 0
          fi
          app_uuid="$(dwarfdump --uuid build/Copper.app/Contents/MacOS/Copper | awk '{print $2}')"
          dsym_uuid="$(dwarfdump --uuid "$dsym" | awk '{print $2}')"
          echo "binary ${app_uuid} · dSYM ${dsym_uuid}"
          if [ -z "$app_uuid" ] || [ "$app_uuid" != "$dsym_uuid" ]; then
            echo "::warning::dSYM UUID ${dsym_uuid} is not the binary's ${app_uuid}; not attaching it"
            exit 0
          fi
          ditto -c -k --keepParent "$dsym" "$OUT/copper-${VERSION}-macos-arm64.dSYM.zip"

      - name: Write copper-version.json
        env:
          OUT: ${{ steps.package.outputs.dir }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          HAS_CLI: ${{ steps.package.outputs.has_cli }}
          PUBLISHED_AT: ${{ steps.meta.outputs.published_at }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const e = process.env;
            const base = `https://github.com/${e.GITHUB_REPOSITORY}/releases`;
            // What is new: the first paragraph of NOTES.md, the gist the
            // CHANGELOG hands it when a version ships. The sidebar update pill
            // shows it under What is New (Fork/UpdatePill.swift). Optional.
            // (No apostrophes in here: this is a single-quoted shell string.)
            let notes = "";
            try {
              const first = fs.readFileSync("NOTES.md", "utf8").split(/\n\s*\n/).find((p) => p.trim());
              notes = (first || "").split("\n").map((l) => l.trim()).filter(Boolean).join(" ");
            } catch {}
            const manifest = {
              schemaVersion: 1,
              product: "copper",
              version: e.VERSION,
              releaseId: e.TAG,
              commit: e.COMMIT,
              source: `https://github.com/${e.GITHUB_REPOSITORY}/commit/${e.COMMIT}`,
              status: "lkg",
              publishedAt: e.PUBLISHED_AT,
              arch: "arm64",
              zip: e.ZIP_NAME,
              sha256: e.SHA256,
              hasCli: e.HAS_CLI === "true",
              archiveUrl: `${base}/download/${e.TAG}/${e.ZIP_NAME}`,
              latestUrl: `${base}/latest/download/copper-macos-arm64.zip`,
              installer: "copper-install.sh",
              notes,
            };
            fs.writeFileSync(`${e.OUT}/copper-version.json`, JSON.stringify(manifest, null, 2) + "\n");
          '
          cat "$OUT/copper-version.json"
          ( cd "$OUT" && shasum -a 256 ./* )

      # Publish off: the signed zip, its sha256, the manifest and the dSYM stay
      # with this run as an artifact. No tag, no release, no repo token.
      - name: Keep the build as this run's artifact (dry run)
        if: steps.mode.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copper-${{ steps.meta.outputs.version }}-macos-arm64-dry-run
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Create the GitHub release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.package.outputs.dir }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          cat > "$notes" <<EOF
          Copper ${VERSION} — built from ${GITHUB_REPOSITORY}@${COMMIT:0:12}.

          **Install**

          \`\`\`sh
          brew install --cask copper-browser/copper/copper
          \`\`\`

          or

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/copper-install.sh | sh
          \`\`\`

          or download \`${ZIP_NAME}\` below, unzip, move Copper.app to /Applications and run \`xattr -cr /Applications/Copper.app\` once (signed with Copper's own certificate, not notarized).

          macOS 14 Sonoma or later, Apple Silicon. Already installed? Copper updates itself — Settings › Updates.

          sha256 \`${SHA256}\`
          EOF
          flags=(--latest)
          [ "$PRERELEASE" = "true" ] && flags=(--prerelease --latest=false)
          # Present only when the dSYM step made it (it warns when it can't).
          dsym_zip="$OUT/copper-${VERSION}-macos-arm64.dSYM.zip"
          [ -f "$dsym_zip" ] || dsym_zip=""
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Copper ${VERSION}" \
            --notes-file "$notes" \
            "${flags[@]}" \
            "$OUT/$ZIP_NAME" "$OUT/$ZIP_NAME.sha256" \
            "$OUT/copper-macos-arm64.zip" "$OUT/copper-macos-arm64.zip.sha256" \
            "$OUT/copper-version.json" "$OUT/copper-install.sh" \
            ${dsym_zip:+"$dsym_zip"}

      - name: Verify the published bytes
        if: steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          curl -fsSL --retry 5 --retry-delay 3 -o "${RUNNER_TEMP}/verify.zip" "$url"
          actual="$(shasum -a 256 "${RUNNER_TEMP}/verify.zip" | cut -d' ' -f1)"
          [ "$actual" = "$SHA256" ] || { echo "::error::$url serves $actual, expected $SHA256" >&2; exit 1; }
          echo "OK $url"

      - name: Run summary
        if: always()
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          HAS_CLI: ${{ steps.package.outputs.has_cli }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          {
            echo "### Copper ${VERSION}"
            echo ""
            if [ "$PUBLISH" = "true" ]; then
              echo "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            else
              echo "- dry run: nothing published (no tag, no release); the signed zip is this run's artifact"
            fi
            echo "- source: https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}"
            echo "- sha256: \`${SHA256}\`"
            echo "- signed: \`$(cat release/designated-requirement.txt 2>/dev/null)\`"
            echo "- CLI shim in bundle: \`${HAS_CLI}\`"
            if [ "$PUBLISH" = "true" ]; then
              echo "- the tap (copper-browser/homebrew-copper) picks this up from copper-version.json on its next bump run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
