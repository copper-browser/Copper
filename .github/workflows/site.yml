# Deploy site/ to https://copper-browser.github.io/Copper/ with GitHub Pages
# (Settings → Pages → Source: GitHub Actions) and to https://copper.exowatt.com
# (S3 + CloudFront in Exowatt AWS, infra/site-aws.yml). A push to fork that touches
# site/ builds, checks and deploys it; a PR that touches site/ only gets built and checked.
# A daily run rebuilds it so the latest release's version and notes show up without a push.
# Build = .github/scripts/site_build.py (stdlib Python): version slots, release notes, sitemap.xml.
name: site
on:
  push:
    branches: [fork]
    paths: ["site/**", ".github/workflows/site.yml", ".github/scripts/site_build.py", ".github/scripts/release_notes.py", "infra/site-aws.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml", ".github/scripts/site_build.py", ".github/scripts/release_notes.py", "infra/site-aws.yml"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build site/ (version, release notes, sitemap)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 .github/scripts/site_build.py --test
          if [ -f .github/scripts/release_notes.py ]; then python3 .github/scripts/release_notes.py --selftest; fi
          python3 .github/scripts/site_build.py
      - name: check every page (assets, links, anchors, header/footer match the template)
        run: python3 .github/scripts/site_build.py --check
      - run: rm site/_page-template.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fork'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  aws:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fork'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No environment: the deploy role trusts this repo's refs/heads/fork subject only.
    permissions: { contents: read, id-token: write }
    env:
      BUCKET: copper-site-340752802981
      DISTRIBUTION: E2MR74IJVKSHAD
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::340752802981:role/gha-copper-site-deploy
          aws-region: us-east-1
      - name: build site/ (same as the Pages build)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 .github/scripts/site_build.py && rm site/_page-template.html
      - name: sync site/ to S3 and invalidate CloudFront
        run: |
          set -euo pipefail
          # Assets first (an hour in browsers), HTML last (always revalidated); CloudFront keeps both until the invalidation.
          aws s3 sync site/ "s3://$BUCKET/" --delete --exclude '*.html' --exclude README.md --exclude .nojekyll \
            --cache-control 'public, max-age=3600, s-maxage=31536000' --only-show-errors
          aws s3 sync site/ "s3://$BUCKET/" --delete --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=0, s-maxage=31536000, must-revalidate' --only-show-errors
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
